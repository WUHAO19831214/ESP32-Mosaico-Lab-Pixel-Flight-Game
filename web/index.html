<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP-Mosaico × Pixel Flight 双端同步飞行</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #162d46;
      --panel: rgba(13, 25, 44, 0.90);
      --border: #4d7a99;
      --accent: #f0580e;
      --teal: #5ce6c0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2468b4;
      color: #f4f4de;
      font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      user-select: none;
    }
    #viewport {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      cursor: crosshair;
    }
    canvas.scene-layer {
      position: absolute;
      display: block;
      image-rendering: pixelated;
    }
    #fire-canvas {
      pointer-events: none;
    }
    .hud-bar {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .bar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      backdrop-filter: blur(8px);
      pointer-events: auto;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    button {
      font: inherit;
      color: #f4f4de;
      background: #24405c;
      border: 1px solid #6e94ae;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    button:hover:not(:disabled) {
      background: #315477;
      border-color: #9ecae6;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button.primary {
      background: #1d5749;
      border-color: var(--teal);
      font-weight: 600;
    }
    button.primary.active {
      background: #7c2d12;
      border-color: #fb923c;
    }
    button.fire-btn {
      background: #7f1d1d;
      border-color: #f87171;
      font-weight: 600;
    }
    button.fire-btn:active, button.fire-btn.firing {
      background: #dc2626;
      border-color: #fecaca;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 3px 8px;
      font-size: 12px;
      color: #dbeafe;
    }
    .thr-pill {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid rgba(52, 211, 153, 0.45);
      color: #6ee7b7;
    }
    .thr-pill.boost {
      background: rgba(240, 88, 14, 0.25);
      border-color: #fb923c;
      color: #fed7aa;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #64748b;
    }
    .dot.wait {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    .dot.online {
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }
    #pip-window {
      position: fixed;
      left: 12px;
      bottom: 42px;
      z-index: 25;
      width: 348px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      pointer-events: auto;
    }
    #pip-window.hidden {
      display: none;
    }
    .pip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: rgba(24, 46, 74, 0.9);
      border-bottom: 1px solid rgba(90, 138, 168, 0.45);
      font-size: 12px;
      font-weight: 600;
      color: var(--teal);
    }
    .pip-header-actions {
      display: flex;
      gap: 5px;
    }
    .pip-mini-btn {
      padding: 2px 7px;
      font-size: 11px;
      background: #1b344d;
      border-color: #517996;
    }
    .pip-body {
      padding: 8px 10px;
      min-height: 226px;
    }
    #pip-canvas {
      display: block;
      width: 100%;
      height: 210px;
      border-radius: 6px;
      background: #081322;
      border: 1px solid rgba(90, 138, 168, 0.35);
    }
    #telemetry-body {
      margin: 0;
      padding: 6px;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.55;
      color: #a7f3d0;
    }
    .tune-box {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 4px 2px;
      font-size: 12px;
      color: #e2e8f0;
    }
    .tune-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tune-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .pip-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 6px 8px;
      background: rgba(11, 21, 37, 0.95);
      border-top: 1px solid rgba(90, 138, 168, 0.45);
    }
    .pip-tab {
      padding: 5px 4px;
      font-size: 11px;
      text-align: center;
      background: #182b42;
      border: 1px solid #3c5f7b;
      color: #cbd5e1;
    }
    .pip-tab.active {
      background: #1d5749;
      border-color: var(--teal);
      color: #ffffff;
      font-weight: 600;
    }
    #hint-line {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 5px 12px;
      background: rgba(11, 26, 51, 0.80);
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <canvas id="scene-canvas" class="scene-layer"></canvas>
    <canvas id="fire-canvas" class="scene-layer"></canvas>
  </div>

  <div class="hud-bar">
    <div class="bar-group">
      <button id="btn-connect" class="primary" type="button">连接 ESP-Mosaico</button>
      <button id="btn-center" type="button" disabled>姿态归零 (C)</button>
      <span class="status-pill"><span id="status-dot" class="dot"></span><span id="status-text">准备就绪</span></span>
    </div>
    <div class="bar-group">
      <button id="btn-view" type="button">视角: 尾随</button>
      <button id="btn-day" type="button">白昼 Day</button>
      <button id="btn-wing" type="button">僚机: +0</button>
      <button id="btn-weapon" type="button">武器: 导弹 (G)</button>
      <button id="btn-fire" class="fire-btn" type="button">发射 (J)</button>
      <span id="thr-pill" class="thr-pill">油门: 50%</span>
      <button id="btn-hud" type="button">小窗口 (D)</button>
    </div>
    <div class="bar-group">
      <button id="btn-minna" type="button">切回日语</button>
      <button id="btn-badge" type="button">切回状态牌</button>
    </div>
  </div>

  <div id="pip-window">
    <div class="pip-header">
      <span id="pip-title">双轴水平仪</span>
      <div class="pip-header-actions">
        <button id="btn-pip-ref" class="pip-mini-btn" type="button">相对归零</button>
        <button id="btn-pip-zero" class="pip-mini-btn" type="button">归零</button>
      </div>
    </div>
    <div class="pip-body">
      <canvas id="pip-canvas" width="328" height="210"></canvas>
      <pre id="telemetry-body" style="display:none">LOADING...</pre>
      <div id="tune-panel" class="tune-box" style="display:none">
        <div class="tune-row">
          <label><input type="checkbox" id="chk-inv-pitch"> 反转俯仰 (抬头/低头)</label>
        </div>
        <div class="tune-row">
          <label><input type="checkbox" id="chk-inv-roll"> 反转转向 (左倾/右倾)</label>
        </div>
        <div class="tune-row">
          <label><input type="checkbox" id="chk-swap-xy"> 交换 XY 轴 (俯仰与横滚互换)</label>
        </div>
        <div class="tune-row">
          <span>摇杆灵敏度: <strong id="lbl-gain">1.0x</strong></span>
          <input type="range" id="rng-gain" min="0.5" max="1.8" step="0.1" value="1.0" style="width:140px">
        </div>
        <div class="tune-row">
          <button id="btn-tune-reset" type="button" style="width:100%">恢复默认手感并下发 ESP32</button>
        </div>
        <div style="font-size:11px;color:#94a3b8">
          非线性飞行摇杆曲线（无特技翻滚）：上抬拉起 / 下压俯冲 / 左右协调压坡度转弯。
        </div>
      </div>
    </div>
    <div class="pip-tabs">
      <button class="pip-tab active" data-mode="level" type="button">水平仪</button>
      <button class="pip-tab" data-mode="radar" type="button">实时地图</button>
      <button class="pip-tab" data-mode="telemetry" type="button">遥测数据</button>
      <button class="pip-tab" data-mode="tune" type="button">手感微调</button>
    </div>
  </div>

  <div id="hint-line"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
